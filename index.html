<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Consentimiento de Cookies</title>
  <link rel="stylesheet" href="estilos.css">
</head>
<body>
  <div class="cookie" id="cookie" hidden>
    <button class="cookie-cerrar" id="cookie-cerrar" type="button">&times;</button>
    <div class="cookie-icono">🍪</div>
    <p class="cookie-mensaje">Usamos cookies para mejorar tu experiencia de usuario.</p>
    <button class="cookie-aceptar" id="cookie-aceptar" type="button">Aceptar las cookies</button>
  </div>

  <script src="script.js"></script>
</body>
</html>
